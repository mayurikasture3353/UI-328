<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event with popup alert</title>
    <style>
        #addTable {
            display: flex;
            align-items: end;
        }
    </style>


    <!--------------------External CSS Link--------------------->
    <link rel="stylesheet" href="event-with-popup.css">

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="container mt-4">
        <button onclick="f1();">Click Me</button>
        <div id="r" class="mt-3"></div> <br>
        <div id="r1" class="mt-3"></div> <br>
        <div id="r2" class="mt-3"></div> <br>
        <div id="r3" class="mt-3"></div> <br>
        <div id="addTable"></div>
        <div class="modal fade" id="summaryModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header  text-white">
                        <h5 class="modal-title">Summary of the input fields</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="modalBodyContent"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // -------------code to bind input elements in related html id's--------------//
        function f1() {
            document.getElementById('r').innerHTML = "Name: <input type='text' id='name'> Email: <input type='email' id='email'> &nbsp;&nbsp;<button onclick='f2();'>Add</button>&nbsp;&nbsp;<button>Remove</button>"
        }
        function f2() {
            document.getElementById('r1').style.display = 'block';
            document.getElementById('r1').innerHTML = "City: <input type='text' id='city'> Phone: <input type='number' id='phone'> &nbsp;&nbsp;<button onclick='f3();'>Add</button>&nbsp;&nbsp;<button onclick='remove1();'>Remove</button>"
        }
        function f3() {
            document.getElementById('r2').style.display = 'block';
            document.getElementById('r2').innerHTML = "Gender: <input type='text' id='gender'> Password: <input type='number' id='pwd'> &nbsp;&nbsp;<button onclick='f4();'>Add</button>&nbsp;&nbsp;<button onclick='remove2();'>Remove</button>"
        }
        function f4() {
            document.getElementById('r3').innerHTML = "<button onclick='tableData();'>Submit</button>"
        }
        //-------------------code to remove the input row on click--------------------//
        function remove1() {
            document.getElementById('r1').style.display = 'none';
        }
        function remove2() {
            document.getElementById('r2').style.display = 'none';
        }
        //code for adding table on button click
        function tableData() {
            document.getElementById('addTable').innerHTML =
                `
            <table>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>City</th>
                    <th>Phone</th>
                    <th>Gender</th>
                    <th>Password</th>
                </tr>
                    <tr>
                    <td><input type="text" id="name1" onchange="updatedData();"></td>
                    <td><input type="email" id="email1" onchange="updatedData();"></td>
                    <td><input type="text" id="city1" onchange="updatedData();"></td>
                    <td><input type="number" id="phone1" onchange="updatedData();"></td>
                    <td><input type="text" id="gender1" onchange="updatedData();"></td>
                    <td><input type="text" id="pwd1" onchange="updatedData();"></td>
                </tr>
            </table> 
            <button onclick="updatedtableSummary()" data-bs-toggle="modal" data-bs-target="#summaryModal">Print</button>
            `
            var name = document.getElementById('name').value;
            document.getElementById('name1').value = name;
            var email = document.getElementById('email').value;
            document.getElementById('email1').value = email;
            var city = document.getElementById('city').value;
            document.getElementById('city1').value = city;
            var phone = document.getElementById('phone').value;
            document.getElementById('phone1').value = phone;
            var gender = document.getElementById('gender').value;
            document.getElementById('gender1').value = gender;
            var pass = document.getElementById('pwd').value;
            document.getElementById('pwd1').value = pass;
        }

        //code for print the updated value from inputs
        function updatedData() {
            // he function ya athi add kelay coz jr me saglya input mdhe value add kelya 
            // ani te submit kel.. tr te table chya input box mdhe print hoil..
            // mg ji table mdhe value print keliye ti jr me change keli tr ti updated value navin var mdhe store kele ahet..
            //  ani nantr alert box mdhe show kele ahet... // main purpose of this
            var updatedName = document.getElementById('name1').value;
            var updatedEmail = document.getElementById('email1').value;
            var updatedCity = document.getElementById('city1').value;
            var updatedPhone = document.getElementById('phone1').value;
            var updatedGender = document.getElementById('gender1').value;
            var updatedPass = document.getElementById('pwd1').value;

            alert(
                "Name: " + updatedName + "\n" +
                "Email: " + updatedEmail + "\n" +
                "City: " + updatedCity + "\n" +
                "Phone: " + updatedPhone + "\n" +
                "Gender: " + updatedGender + "\n" +
                "Password: " + updatedPass
            )
        }
        //to print the updated data inside the card.

        function updatedtableSummary() {

            // he variable me yasthi add kelet coz..
            // me table mdhe print keleli value ahe 
            var updatedName = document.getElementById('name1').value;
            var updatedEmail = document.getElementById('email1').value;
            var updatedCity = document.getElementById('city1').value;
            var updatedPhone = document.getElementById('phone1').value;
            var updatedGender = document.getElementById('gender1').value;
            var updatedPass = document.getElementById('pwd1').value;

            document.getElementById('modalBodyContent').innerHTML =
                `
                    <div class="row mb-2">
                        <div class="col"><p><strong>Name:</strong> ${updatedName}</p></div>
                        <div class="col"><p><strong>Email:</strong> ${updatedEmail}</p></div>
                        <div class="col"><p><strong>City:</strong> ${updatedCity}</p></div>
                    </div>
                    <div class="row mb-2">
                        <div class="col"><p><strong>Phone:</strong> ${updatedPhone}</p></div>
                        <div class="col"><p><strong>Gender:</strong> ${updatedGender}</p></div>
                        <div class="col"><p><strong>Password:</strong> ${updatedPass}</p></div>
                    </div>
                    `;
        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
