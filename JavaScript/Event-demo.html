<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Js Event Demo</title>
  <link rel="stylesheet" href="event-demo.css">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
  
<div class="container mt-4">
    <button onclick="f1();">Click Me</button>
    <div id="r" class="mt-3"></div> <br>
    <div id="r1" class="mt-3"></div> <br>
    <div id="r2" class="mt-3"></div> <br>
    <div id="r3" class="mt-3"></div> <br>
    <div id="tableContainer"></div>
</div>

<script>

    function f1(){
        document.getElementById('r').innerHTML = "Name: <input type='text' id='name'> Email: <input type='email' id='email'> &nbsp;&nbsp;<button onclick='f2()'>Add</button>&nbsp;&nbsp;<button>Remove</button>"
    }
    function f2(){
        document.getElementById('r1').style.display = 'block';
        document.getElementById('r1').innerHTML = "City: <input type='text' id='city'> Phone: <input type='number' id='phone'> &nbsp;&nbsp;<button onclick='f3()'>Add</button>&nbsp;&nbsp;<button onclick='remove1();'>Remove</button>"
    }
    function f3(){
        document.getElementById('r2').style.display = 'block';
     document.getElementById('r2').innerHTML = "Gender: <input type='text' id='gender'> Password: <input type='number' id='pwd'> &nbsp;&nbsp;<button onclick='f4();'>Add</button>&nbsp;&nbsp;<button onclick='remove2();'>Remove</button>"
    }

    function f4(){
        document.getElementById('r3').innerHTML = "<button onclick='showTable();'>Submit</button>"
    }

    function remove1(){
        document.getElementById('r1').style.display = 'none';
    }
     function remove2(){
        document.getElementById('r2').style.display = 'none';
    }

    function showTable() {
    document.getElementById('tableContainer').innerHTML = 
    `<table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th>Phone</th>
                <th>Gender</th>
                <th>Password</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type='text' id='name1'></td>
                <td><input type='email' id='email1'></td>
                <td><input type='text' id='city1'></td>
                <td><input type='number' id='phone1'></td>
                <td><input type='text' id='gender1'></td>
                <td><input type='text' id='pwd1'></td>
            </tr>
        </tbody>
    </table>`;

    var name = document.getElementById('name').value;
    document.getElementById('name1').value = name;
    var email = document.getElementById('email').value;
    document.getElementById('email1').value = email;
    var city = document.getElementById('city').value;
    document.getElementById('city1').value = city;
    var phone = document.getElementById('phone').value;
    document.getElementById('phone1').value = phone;
    var gender = document.getElementById('gender').value;
    document.getElementById('gender1').value = gender;
    var pass = document.getElementById('pwd').value;
    document.getElementById('pwd1').value = pass;
}

</script>

</body>
</html>
