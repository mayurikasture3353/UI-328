<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart Cart</title>
  <link rel="stylesheet" href="flipkart.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col-md-4">
        <div id="item" style="display: block;"></div>
      </div>
    </div>
  </div>
  <div class="container mt-4" id="container"></div>

  <script>

    let price = 4999;
    let discount = 3700;
    let promiseFee = 19;
    let total = 1318;
    let quantity = 1;

    document.getElementById('item').innerHTML =
      `
        <div class="card">
  <img src="watch.jpeg" class="card-img-top" alt="...">
  <div class="card-body">
    <a href="#" class="btn btn-primary" onclick="callCart();">Add to cart</a>
  </div>
</div>
     `;

    function callCart() {
      document.getElementById('item').style.display = "none";
      document.getElementById('container').innerHTML =

        `
 <div class="row">
  <div class="col-md-4">
    <div class="card">
      <img src="watch.jpeg" class="card-img-top" alt="...">
      <div class="card-body">
        <span class="btn btn-secondary" onclick="doublePrice()">+</span>
        <span class="mx-2 btn btn-secondary" id="quantity">1</span>
        <span class="mx-2 btn btn-secondary" onclick="halfPrice()">−</span>
      </div>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card">
      <div class="card-body">
        <h3 class="text-secondary">Price details</h3>
        <p>Price: ₹<span id="price">1399</span></p>
        <p>Discount: ₹<span id="discount">3700</span></p>
        <p>Protect Promise Fee: ₹<span id="promise_fee">19</span></p>
        <p>Total Amount: ₹<span id="total_amount">1318</span></p>
      </div>
    </div>
  </div>
</div>
`;
    }



    function doublePrice() {
      quantity++;
      document.getElementById('quantity').innerHTML = quantity;

      price = price * 2;
      document.getElementById('price').innerHTML = price;
      discount = discount * 2;
      document.getElementById('discount').innerHTML = discount;
      promiseFee = promiseFee * 2;
      document.getElementById('promise_fee').innerHTML = promiseFee;
      total = price - discount + promiseFee;
      document.getElementById('total_amount').innerHTML = total;
    }

    function halfPrice() {
      if (price > 4999) {
        price = price / 2;
        document.getElementById('price').innerHTML = price;
      }
      if (discount > 3700) {
        discount = discount / 2;
        document.getElementById('discount').innerHTML = discount;
      }
      if (promiseFee > 19) {
        promiseFee = promiseFee / 2;
        document.getElementById('promise_fee').innerHTML = promiseFee;
      }
      if (quantity > 1) {
        quantity--;
        document.getElementById('quantity').innerHTML = quantity;
      }
      total = price - discount + promiseFee;
      document.getElementById('total_amount').innerHTML = total;
    }


  </script>
</body>

</html>
