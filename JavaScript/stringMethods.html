<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Methods</title>
</head>
<body>
    <script>
        let x = 'Welcome to the club';
        console.log(x.length);
        // 

        let y = 'Hello, how are you?';
        console.log(y.toUpperCase());

        let z = 'WELCOME TO THE DESHMUKH FAMILY';
        console.log(z.toLowerCase());

        let a = 'Have a good day';
        console.log(a.slice(7));
        console.log(a.slice(1,6));

        let b = 'Have a nice day';
        console.log(b.repeat(5));

        let c = "Welcome to India";
        console.log(c.replace('India', 'Bharat'));

        let d = 'Javascript is a scripting language';
        console.log(d.indexOf('scripting'));

        let e = 'Javascript is a scripting language';
        console.log(e.search('script'));
    </script>
</body>
</html>
