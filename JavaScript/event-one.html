<!DOCTYPE html>
<html lang="en">

<style>
  body {
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #e0eafc, #cfdef3);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    background: #ffffff;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 500px;
    text-align: center;
  }

  button.btn-secondary {
    background-color: #6c63ff;
    border: none;
    padding: 12px 25px;
    font-weight: 500;
    border-radius: 30px;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  button.btn-secondary:hover {
    background-color: #574b90;
    color: #fff;
  }

  button.btn-success {
    margin-left: 10px;
    padding: 10px 20px;
    font-size: 14px;
    border-radius: 20px;
    border: none;
    background-color: #28a745;
    transition: background 0.3s ease;
  }

  button.btn-success:hover {
    background-color: #218838;
  }

  #demo {
    margin-top: 25px;
  }

  #demo input[type="text"] {
    margin: 10px 5px;
    padding: 8px 12px;
    width: 120px;
    border-radius: 8px;
    border: 1px solid #ced4da;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    text-align: center;
    font-size: 16px;
  }

  #Ans {
    margin-top: 25px;
    font-size: 28px;
    color: #198754;
    font-weight: bold;
  }
</style>





<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Event - First</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body>

    <div class="container">
        <button class="btn btn-secondary" onclick="add();">Click me</button>
         <p id="demo" class="mt-3"></p>
         <h2 id="Ans"></h2>
    </div>

    <script>


        function add(){
            document.getElementById("demo").innerHTML = "No1. <input type ='text' id='no1'> No.2 <input type ='text' id='no2'> <button onclick='addition();' class='btn btn-success'>Add</button>";

        }

            function addition(){
                var no1 = parseInt(document.getElementById('no1').value);
                // he full line cha arth asa ahe ki...
                //(document.getElementById('no1') - no1 ya id cha element find kr
                //(document.getElementById('no1').value - no1 ya id mdhe me ji value type kren ti ghe...
                //var no1 = (document.getElementById('no1').value) -- me ji value diiye ti no1 navachya var mdhe store kr..
                //parseInt - dileli value jr string mdhe asel tr ti number mdhe convert kr

                var no2 = parseInt(document.getElementById('no2').value);
                document.getElementById('Ans').innerHTML = no1+no2;
                (document.getElementById('no1').value) ="";
                (document.getElementById('no2').value) ="";
            }

    </script>

</body>

</html>
