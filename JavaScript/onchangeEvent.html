<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Js onChange Event</title>

  <!--------------------External CSS Link--------------------->
  <link rel="stylesheet" href="onchangeEvent.css">

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>
  <div class="container mt-4">
    <h3 class="text-center text-primary mb-3">Product Billing Form</h3>
    <div class="text-center mb-3">
      <button class="btn btn-primary shadow" onclick="add();">Click me</button>
    </div>
    <div id="input"></div>
    <div id="resultofInput" class="mt-4"></div>

    <script>
      function add() {
        // alert("Added the total amount succesfully");
        document.getElementById("input").innerHTML = `
        <form class="custom-form">
          <div class="row mb-3">
            <div class="col-md-4">
              <div class="d-flex align-items-center">
                <label class="me-2" style="width: 100px;">Name:</label>
                <input type='text' id='name' class='form-control mb-3'>
              </div>
            </div>
            <div class="col-md-4">
              <div class="d-flex align-items-center">
                <label class="me-2" style="width: 100px;">Email:</label>
                <input type='email' id='email' class='form-control mb-3'>
              </div>
            </div>
            <div class="col-md-4">
              <div class="d-flex align-items-center">
                <label class="me-2" style="width: 100px;">Mobile:</label>
                <input type='number' id='mobile' class='form-control mb-3'>
              </div>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <div class="d-flex align-items-center">
                <label class="me-2" style="width: 100px;">Product:</label>
                <input type='text' id='product' class='form-control mb-3'>
              </div>
            </div>
            <div class="col-md-4">
              <div class="d-flex align-items-center">
                <label class="me-2" style="width: 100px;">Price:</label>
                <input type='number' id='price' class='form-control mb-3'>
              </div>
            </div>
            <div class="col-md-4">
              <div class="d-flex align-items-center">
                <label class="me-2" style="width: 100px;">Discount:</label>
                <input type='number' id='discount' class='form-control mb-3'>
              </div>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <div class="d-flex align-items-center">
                <label class="me-2" style="width: 100px;">GST:</label>
                <input type='number' id='gst' class='form-control mb-3'>
              </div>
            </div>
            <div class="col-md-4">
              <div class="d-flex align-items-center">
                <label class="me-2" style="width: 100px;">Tax:</label>
                <input type='number' id='tax' class='form-control mb-3' onchange='addition();'>
              </div>
            </div>
            <div class="col-md-3">
              <div class="d-flex align-items-center">
                <label class="me-2" style="width: 100px;">Total Amount:</label>
                <input type='number' id='totalAmount' class='form-control mb-3'>
              </div>
            </div>
            <div class="col-md-1 d-flex align-items-start">
              <button class='btn btn-success w-100 shadow' type='button' onclick='summary();'>Add</button>
            </div>
          </div>
        </form>`;
      }

      function addition() {
        // alert('Successful');
        var price = parseInt(document.getElementById('price').value);
        // ya line ch meaning as ki...
        // price navacha id jyala asel to find kr
        //and .value mhnje tya id mdhe input keleli value get kr..
        // ani ti var price mdhe store kr
        // ani parseInt means.. dileli string number mdhe convert krne
        var discount = parseInt(document.getElementById('discount').value);
        var gst = parseInt(document.getElementById('gst').value);
        var tax = parseInt(document.getElementById('tax').value);
        var total = price - discount + gst + tax;
        document.getElementById('totalAmount').value = total;
      }

      function summary() {
        var name1= document.getElementById('name').value;
        var email1= document.getElementById('email').value;
        var mobile1= document.getElementById('mobile').value;
        var product1= document.getElementById('product').value;
        var price1= document.getElementById('price').value;
        var discount1= document.getElementById('discount').value;
        var gst1= document.getElementById('gst').value;
        var tax1= document.getElementById('tax').value;
        var totalAmount1= document.getElementById('totalAmount').value;
        document.getElementById("resultofInput").innerHTML =
          `<div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">Summary of the input fields</h5>
            </div>
            <div class="card-body">
              <div class="row mb-2">
                <div class="col"><p><strong>Name:</strong>${name1}</p></div>
                <div class="col"><p><strong>Email:</strong> ${email1}</p></div>
                <div class="col"><p><strong>Mobile:</strong> ${mobile1}</p></div>
              </div>
              <div class="row mb-2">
                <div class="col"><p><strong>Product:</strong> ${product1}</p></div>
                <div class="col"><p><strong>Price:</strong> ${price1}</p></div>
                <div class="col"><p><strong>Discount:</strong> ${discount1}</p></div>
              </div>
              <div class="row">
                <div class="col"><p><strong>GST:</strong> ${gst1}</p></div>
                <div class="col"><p><strong>Tax:</strong> ${tax1}</p></div>
                <div class="col"><p><strong>Total Amount:</strong> ${totalAmount1}</p></div>
              </div>
            </div>
          </div>`;
      }

      // ${name1} - me name1 nachya var mdhe ji value add keliye ti print krte
    </script>
  </div>
</body>
</html>
