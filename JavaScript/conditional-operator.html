<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }
    </style>
</head>

<body>


    <div class="container mt-3">
        <div id="btn"></div>
        <div id="purpleDiv" class="mt-3"></div>
        <div id="redDiv" class="mt-3"></div>
    </div>

    <script>
        document.getElementById('btn').innerHTML = `
        <input type="text" id="color">
        <button onclick="abc();">Click Me</button>
    `;

        var A = `<div style="width:100%; height:300px; background-color:purple; display:flex; justify-content:center; align-items:center; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2);">
            <h4 style="text-align:center; color:white; font-size:24px; font-family:sans-serif; margin:0;">
                I am Purple Box
            </h4>
         </div>`;

        var B = `<div style="width:100%; height:300px; background-color:red; display:flex; justify-content:center; align-items:center; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2);">
            <h4 style="text-align:center; color:white; font-size:24px; font-family:sans-serif; margin:0;">
                I am Red Box
            </h4>
         </div>`;


        function abc() {
            var color = document.getElementById('color').value;

            color === 'purple'
                ? document.getElementById('purpleDiv').innerHTML = A
                : color === 'red'
                    ? document.getElementById('redDiv').innerHTML = B
                    : alert("Please type either 'purple' or 'red'");
        }
    </script>

</body>

</html>
