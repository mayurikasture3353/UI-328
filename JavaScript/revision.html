<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Operator</title>
</head>

<body>
    <div id="btn"></div>
    <div id="purpleDiv"></div>
    <div id="redDiv"></div>

    <script>
        document.getElementById('btn').innerHTML =
            `
        <input type="text" id="color">
        <button onclick="colorChanger();">Click Me</button>
        `;

        var A = '<div style="background-color: purple; height: 300px; width: 100%; text-align:center; padding-top: 50px; color: white;"><h2>Have Nice Day</h2></div>';
        var B = '<div style="background-color: red; height: 300px; width: 100%;" text-align:center;" padding-top: 50px; color: white;"><h2>Have Nice Day</h2></div>';

        function colorChanger() {
            var color = document.getElementById('color').value;

            color === 'purple' ?
                document.getElementById('purpleDiv').innerHTML = A :
                color === 'red' ?
                    document.getElementById('redDiv').innerHTML = B :
                    alert('please enter either red or purple');
        }
    </script>
</body>

</html>
