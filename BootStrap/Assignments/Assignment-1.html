<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BootStrap</title>

    <!-------------------------------- External Css Link-------------------------------------->
  
     <link rel="stylesheet" href="../bootstrap-5.1.3-dist/css/bootstrap.css" type="text/css">
     <link rel="stylesheet" href="../bootstrap-5.1.3-dist/css/bootstrap.min.css" type="text/css">

     <!-------------------------------- External JS Link-------------------------------------->

     <script src="../bootstrap-5.1.3-dist/js/bootstrap.js" type="text/javascript"></script>
     <script src="../bootstrap-5.1.3-dist/js/bootstrap.min.js" type="text/javascript"></script>



     <!--------------------------------- Bootstrap Container--------------------------------->

     <div class="container-fluid">
        <div class="row">
            <div class="col-md-6 bg-info bg-gradient" style="height: 100px;"></div>
            <div class="col-md-6 bg-secondary bg-gradient" style="height: 100px;"></div>
        </div>
        <div class="row">
            <div class="col-md-4 bg-success bg-gradient" style="height: 100px;"></div>
            <div class="col-md-4 bg-danger bg-gradient" style="height: 100px;"></div>
            <div class="col-md-4 bg-warning bg-gradient" style="height: 100px;"></div>
        </div>
        <div class="row">
            <div class="col-md-5 bg-primary bg-gradient" style="height: 100px;"></div>
            <div class="col-md-2 bg-dark bg-gradient" style="height: 100px;"></div>
            <div class="col-md-5 bg-secondary bg-gradient" style="height: 100px;"></div>
        </div>
        <div class="row">
            <div class="col-md-5 bg-warning bg-gradient" style="height: 100px;"></div>
            <div class="col-md-2 bg-primary bg-gradient" style="height: 100px;"></div>
            <div class="col-md-5 bg-dark bg-gradient" style="height: 100px;"></div>
        </div>
        <div class="row">
            <div class="col-md-4 bg-success bg-gradient" style="height: 100px;"></div>
            <div class="col-md-4 bg-danger" style="height: 100px;"></div>
            <div class="col-md-4 bg-warning bg-gradient" style="height: 100px;"></div>
        </div>
        <div class="row">
            <div class="col-md-4 bg-warning bg-gradient" style="height: 100px;"></div>
            <div class="col-md-4 bg-danger" style="height: 100px;"></div>
            <div class="col-md-4 bg-success bg-gradient" style="height: 100px;"></div>
        </div>
        <div class="row">
            <div class="col-md-5 bg-dark bg-gradient" style="height: 100px;">
                <div class="row">
                    <div class="col-md-10 bg-primary m-4" style="height: 55px;"></div>
                </div>
            </div>
            <div class="col-md-4 bg-warning" style="height: 100px;">
                <div class="row">
                    <div class="col-md-10 bg-secondary m-4" style="height: 60px;"></div>
                </div>
            </div>
            <div class="col-md-3 bg-info bg-gradient" style="height: 100px;">
                <div class="row">
                    <div class="col-md-10 bg-dark m-4" style="height: 60px;"></div>
                </div>
            </div>
        </div>
     </div>

</head>
