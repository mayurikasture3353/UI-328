<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Assignment</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="ass-8.css">

    <!-------------------------------------Fontawesome cdn----------------------------------->


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

    <!--------------------------------- Form  section--------------------------------->

    <section class="formSection">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <div class="leftFormSection">
                        <img src="images/affectionate-indian-couple-celebrating-propose-day-together_new.jpg" alt=""
                            class="w-100">
                    </div>
                </div>
                <div class="col-md-6">
                <form action="">
                        <div class="row align-items-center mb-3">
                        <div class="col-md-6">
                            <h2>Register FREE</h2>
                        </div>
                        <div class="col-md-6">
                            <p> <span>*</span>All Fields are mandatory</p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <label for=""> <span>*</span>Profile For</label>
                        </div>
                        <div class="col-md-9">
                            <select name="" id="" class="form-control">
                                <option value="">Selected</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <label for=""> <span>*</span>Full Name</label>
                        </div>
                        <div class="col-md-9">
                            <div class="row">
                                <div class="col-md-4">
                                    <input type="text" name="" id="" class="form-control" placeholder="First Name">
                                </div>
                                <div class="col-md-4">
                                    <input type="text" name="" id="" class="form-control" placeholder="Middle Name">
                                </div>
                                <div class="col-md-4">
                                    <input type="text" name="" id="" class="form-control" placeholder="Last Name">
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <label for=""> <span>*</span>Gender</label>
                        </div>
                        <div class="col-md-9">
                            <div class="row">
                                <div class="col-md-3">
                                    <input type="radio" name="gender" id="" value="male">
                                    <label for="">Male</label>
                                </div>
                                <div class="col-md-3">
                                    <input type="radio" name="gender" id="" value="female">
                                    <label for="">Female</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <label for=""><span>*</span>Date of Birth</label>
                        </div>
                        <div class="col-md-9">
                            <input type="date" name="" id="" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="row">
                                <div class="col-md-6">
                                    <label for=""><span>*</span>Religion</label>
                                </div>
                                <div class="col-md-6">
                                    <select name="" id="" class="form-control">
                                        <option value="" selected >Select</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <div class="col-md-6">
                                    <label for=""><span>*</span>Caste</label>
                                </div>
                                <div class="col-md-6">
                                    <select name="" id="" class="form-control">
                                        <option value="" selected>Select</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="row">
                                <div class="col-md-6">
                                    <label for=""><span>*</span>Mother Tongue</label>
                                </div>
                                <div class="col-md-6">
                                    <select name="" id="" class="form-control">
                                        <option value="" selected >Select</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="row">
                                <div class="col-md-6">
                                    <label for=""><span>*</span>City</label>
                                </div>
                                <div class="col-md-6">
                                    <select name="" id="" class="form-control">
                                        <option value="" selected>Select</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <label for=""> <span>*</span>Mobile No.</label>
                        </div>
                        <div class="col-md-9">
                            <input type="number" name="" id="" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <label for=""> <span>*</span>Email</label>
                        </div>
                        <div class="col-md-9">
                            <input type="email" name="" id="" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <label for=""> <span>*</span>User ID</label>
                        </div>
                        <div class="col-md-9">
                            <input type="number" name="" id="" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3">
                            <label for=""> <span>*</span>Password</label>
                        </div>
                        <div class="col-md-7">
                            <input type="password" name="" id="" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <p>By choosing to continue, you agre to our <span>Terms and Conditions</span> and <span>Privacy Policy</span> </p>
                        </div>
                        <div class="col-md-4">
                            <p>Already a Member, <br>login</p>
                        </div>
                        <div class="col-md-2">
                            <div class="register">
                                <button class="btn btn-success w-100">Register</button>
                            </div>
                        </div>
                    </div>
                </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
