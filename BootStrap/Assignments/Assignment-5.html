<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Collapse</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        button:focus {
            box-shadow: unset !important;
        }

        button {
            border: unset !important;
        }

        .navbar {
            box-shadow: rgba(0, 0, 0, 0.1) 0px 10px 50px;
        }

        .nav-link {
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: #0d6efd !important;
            border-bottom: 2px solid #0d6efd;

        }

        /* ul{
    align-items: center;
} */

        .btn-primary {
            border-radius: 20px;
            padding: 6px 20px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            /* Darker shade */
        }

        @media (max-width: 620px) {
            .btn-primary {
                padding: 6px 30px;
                margin-top: 12px;
            }

            ul {
                align-items: end;
            }
        }
    </style>

</head>


<body>

    <div class="container">
        <div class="navbar navbar-expand-lg navbar-light  justify-content-center align-items-center">
            <a href="#">
                <img src="images/DG-New-Logo.jpeg" alt="" style="width: 120px;">
            </a>
            <button class="navbar-toggler ms-auto" data-bs-toggle="collapse" data-bs-target="#menuBar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuBar">
                <ul class="navbar-nav">
                    <li class="nav-item text-end pe-5"><a href="#" class="nav-link text-dark">Home</a></li>
                    <li class="nav-item text-end pe-5"><a href="#" class="nav-link text-dark">About</a></li>
                    <li class="nav-item text-end pe-5"><a href="#" class="nav-link text-dark">Services</a></li>
                    <li class="nav-item text-end pe-5"><a href="#" class="nav-link text-dark">Products</a></li>
                    <li class="nav-item text-end pe-5"><a href="#" class="nav-link text-dark">Portfolio</a></li>
                    <li class="nav-item text-end pe-5"><a href="#" class="nav-link text-dark">Blog</a></li>
                    <li class="nav-item text-end pe-5"><a href="#" class="nav-link text-dark">News</a></li>
                    <li class="nav-item text-end pe-4"><a href="#" class="nav-link text-dark">Contact Us</a></li>
                    <!-- <li><a href="btn btn-primary">Login</a></li> -->
                    <div class="ms-auto pe-2">
                        <button class="btn btn-primary btn-md">Login</button>
                    </div>

                </ul>
            </div>
            <!-- <button class="btn btn-primary m-auto">Login</button> -->
        </div>
    </div>

</body>

</html>
